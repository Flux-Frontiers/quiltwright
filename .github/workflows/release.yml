# Publish a GitHub Release on tag push, and — on request — render the Looking
# Glass quilts and attach them to it.
#
# Pushing a `v*` tag builds the wheel and sdist, creates the Release from
# release-notes.md, and publishes those same two files to PyPI.  That is the
# fast path and runs on every tag.
#
# The PyPI upload uses trusted publishing (OIDC), so there is no API token in
# the repository secrets — the runner mints a short-lived token PyPI trades for
# an upload.  It is configured on PyPI under the project's Publishing settings
# and must name this repository, the workflow file `release.yml`, and the
# `pypi` environment below; change any of those three and the upload stops.
#
# Quilts are 25-40 MB each and never enter git (see .gitignore); they are
# release assets instead.  Rendering them costs hours, so it is opt-in: run
# this workflow manually with render_quilts checked, against an existing tag.
# Each quilt gets its own 4-vCPU runner and they render in parallel.
#
# Cost, extrapolated from an 18-core workstation: bell-jar ~40 min, porin
# ~80 min.  The museum is the expensive one — its full +A0.05 recursive
# supersample does not fit the 6-hour job limit on a standard runner, so
# CI renders it at +A0.1 (the scripts' still-quality threshold).  For the
# full-quality museum quilt, render locally and attach it with:
#
#     make quilt-museum && make release-assets TAG=<tag>

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build and attach assets to
        required: true
      render_quilts:
        description: also render the quilts (hours — see the matrix below)
        type: boolean
        default: true

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only main --no-interaction

      - name: Build wheel and sdist
        run: poetry build

      # Hand the built files to the publish job rather than letting it rebuild,
      # so PyPI and the GitHub Release carry byte-identical artifacts.
      - name: Stash dist for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Quiltwright $TAG" \
              --notes-file release-notes.md
          fi

  publish:
    name: Publish to PyPI
    needs: release
    # Only a real tag push publishes.  A workflow_dispatch run exists to attach
    # quilts to a tag that already shipped, and PyPI refuses to re-upload a
    # version it already holds, so publishing there would fail every time.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quiltwright
    # Replaces the workflow-level `contents: write` for this job: publishing
    # needs to mint an OIDC token and nothing else.
    permissions:
      id-token: write
    steps:
      - name: Fetch the artifacts the release job built
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  quilt:
    name: Render ${{ matrix.subject }}
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_quilts }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: bell-jar
            target: quilt-bell-jar
            args: ""
          - subject: porin
            target: quilt-porin
            args: ""
          - subject: museum
            target: quilt-museum
            args: "--antialias 0.1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install POV-Ray
        run: |
          sudo apt-get update
          sudo apt-get install -y povray povray-includes

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install quiltwright
        run: |
          python -m pip install .

      - name: Render ${{ matrix.subject }}
        run: |
          make ${{ matrix.target }} PYTHON=python JOBS=$(nproc) EXTRA_ARGS="${{ matrix.args }}"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" renders/quilts/*_qs*.png --clobber
