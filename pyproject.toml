# pyproject.toml — quiltwright package configuration
#
# Author: Eric G. Suchanek, PhD
#
# Quick install (poetry)
# ----------------------
#   poetry install                     core (quilt geometry + Bridge control)
#   poetry install --with viz          + pyvista/VTK rendering backend
#   poetry install --with video        + bundled ffmpeg for video encoding
#   poetry install --with dev          + test and lint tooling
#
# Quick install (pip)
# -------------------
#   pip install -e .                   core
#   pip install -e ".[viz]"            + pyvista rendering backend
#
# Run tests
# ---------
#   pytest                             uses [tool.pytest.ini_options]
#
# The POV-Ray backend needs a `povray` binary on PATH (brew install povray),
# not a Python dependency.

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "quiltwright", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "quiltwright"
version = "0.4.0"
description = "Holographic output for Looking Glass displays: off-axis multi-view quilts from PyVista or POV-Ray scenes"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }]
keywords = [
    "looking-glass",
    "light-field",
    "holographic-display",
    "quilt",
    "povray",
    "pyvista",
    "stereoscopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"

# Core stays deliberately small: quilt geometry, tiling, filenames and the
# Bridge HTTP client need nothing but numpy and pillow.  The renderers are
# extras so a machine that only casts pre-rendered quilts stays lean.
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
viz = ["pyvista>=0.44"]
# ffmpeg is found on PATH first and only falls back to this, so a system
# ffmpeg makes the extra redundant.  It also stays optional on licence
# grounds: see docs/install.md section 4.
video = ["imageio-ffmpeg>=0.4"]

[project.urls]
Homepage = "https://github.com/suchanek/quiltwright"
Repository = "https://github.com/suchanek/quiltwright"
Documentation = "https://github.com/suchanek/quiltwright/tree/main/docs"
Issues = "https://github.com/suchanek/quiltwright/issues"

# ---------------------------------------------------------------------------
# Dependency groups (poetry)
# ---------------------------------------------------------------------------
# Groups mirror the PEP 621 extras above one-for-one, so `poetry install --with
# viz` and `pip install ".[viz]"` produce the same environment.  ffmpeg is
# deliberately its own group rather than part of viz: the binary imageio-ffmpeg
# bundles is a GPLv3 build (--enable-gpl --enable-version3), which a BSD-3
# project should hand people on request rather than by default.
[tool.poetry.group.viz]
optional = true

[tool.poetry.group.viz.dependencies]
pyvista = ">=0.44"

[tool.poetry.group.video]
optional = true

[tool.poetry.group.video.dependencies]
imageio-ffmpeg = ">=0.4"

# imageio-ffmpeg is a dev dependency as well as an extra: without it the video
# tests skip, and a skipped test reports success while asserting nothing.  It
# is the only skip condition pip alone can lift — the pyvista tests also need a
# system GL stack and an X server, which no dependency can supply.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=5.0"
ruff = ">=0.6"
imageio-ffmpeg = ">=0.4"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
