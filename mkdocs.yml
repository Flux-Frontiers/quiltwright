site_name: Quiltwright
site_description: Holographic output for Looking Glass displays -- off-axis multi-view quilts from PyVista, POV-Ray, or Blender Cycles scenes.
site_url: https://flux-frontiers.github.io/quiltwright/
repo_url: https://github.com/Flux-Frontiers/quiltwright
repo_name: Flux-Frontiers/quiltwright
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - Usage recipes: usage.md
      - The shell workflow: shell.md
      - CLI reference: cli.md
  - Backends:
      - PyVista / VTK: lfd.md
      - POV-Ray: povray.md
      - Blender Cycles: cycles.md
      - Mesh import: mesh-import.md
      - Writing scenes with povgen: povgen.md
      - The archive-scene workflow: pov-workflow.md
      - Molecular scenes (pypdb2pov): pdb2pov.md
      - Hololuminescent Displays: hld.md
  - Scene sources:
      - PyVista example datasets: pyvista-datasets.md
      - The Virtual Brain: tvb-data.md
  - The museum scene:
      - About the image: about-the-image.md
      - Gallery: gallery.md
  - Architecture: architecture.md
  - API reference:
      - Quilt geometry: api/quilt.md
      - PyVista backend (lfd): api/lfd.md
      - POV-Ray backend: api/povray.md
      - Blender Cycles backend: api/cycles.md
      - Scene primitives (povgen): api/povgen.md
      - Hololuminescent Displays: api/hld.md
      - Lenticular weave: api/weave.md
      - Dynamic Desktop HEIC: api/dynamic.md
      - Looking Glass Bridge: api/bridge.md
      - The Virtual Brain data: api/tvb_data.md
      - Runtime helpers: api/runtime.md
