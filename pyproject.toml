# pyproject.toml — quiltwright package configuration
#
# Author: Eric G. Suchanek, PhD
#
# Quick install (poetry)
# ----------------------
#   poetry install                     core (quilt geometry + Bridge control)
#   poetry install --with viz          + pyvista/VTK rendering backend
#   poetry install --with molecules    + pypdb2pov, for the molecular scenes
#   poetry install --with video        + bundled ffmpeg for video encoding
#   poetry install --with dev          + test and lint tooling
#   poetry install --with kg           + pycodekg/dockg, maintainer tooling
#   poetry install --with docs         + mkdocs, to build the Pages site
#   poetry install --all-extras --with dev,kg,docs + everything
#
# Groups combine, and every group is optional -- a bare `poetry install` skips
# all of them.  No space after the comma: Poetry reads the name following it as
# a positional argument and refuses the command.
#
#   poetry install --with viz,video,dev
#
# Quick install (pip)
# -------------------
#   pip install -e .                   core
#   pip install -e ".[viz]"            + pyvista rendering backend
#   pip install -e ".[viz,video]"      + ffmpeg as well
#   pip install -e ".[molecules]"      + pypdb2pov, for the molecular scenes
#
# `kg` has no pip equivalent on purpose.  It is tooling this repo runs, not a
# feature of the package, so it is a Poetry group only and never reaches the
# published wheel metadata.
#
# Run tests
# ---------
#   poetry install --with dev          prerequisite
#   pytest                             uses [tool.pytest.ini_options]
#
# The POV-Ray backend needs a `povray` binary on PATH (brew install povray),
# and the Cycles backend a `blender` binary (brew install --cask blender) --
# renderers, not Python dependencies.

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "quiltwright", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "quiltwright"
version = "0.10.1"
description = "Holographic output for Looking Glass displays: off-axis multi-view quilts from PyVista, POV-Ray or Blender Cycles scenes"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }]
keywords = [
    "looking-glass",
    "light-field",
    "holographic-display",
    "quilt",
    "povray",
    "blender",
    "cycles",
    "pyvista",
    "stereoscopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"

# Core stays deliberately small: quilt geometry, tiling, filenames, the
# Bridge HTTP client and the `quiltwright` CLI need nothing but numpy, pillow
# and click.  The renderers are extras so a machine that only casts
# pre-rendered quilts stays lean.
dependencies = ["numpy>=1.26", "pillow>=10.0", "click>=8.1.0,<9"]

[project.optional-dependencies]
viz = ["pyvista>=0.44"]
# ffmpeg is found on PATH first and only falls back to this, so a system
# ffmpeg makes the extra redundant.  It also stays optional on licence
# grounds: see docs/install.md section 4.
video = ["imageio-ffmpeg>=0.4"]

# Molecular scenes.  pypdb2pov turns PDB and PDBx/mmCIF structures into
# POV-Ray scenes and ships the atom textures inside the package, so installing
# it is the whole setup for pov-scenes/vitrine/ -- `pypdb2pov --include-dir`
# reports where they landed, and scripts/render_vitrine.py asks the package
# rather than being told a path.
#

# Optional for the same reason `viz` is: only the molecular scenes need it,
# and a machine that renders anything else should not carry it.  (It is
# BSD-3-Clause, like this project -- the 0.1.0 metadata on PyPI says
# GPL-2.0-or-later, which is a packaging error corrected in its repository
# and fixed on PyPI by the next release, since per-release metadata is
# immutable.)
molecules = ["pypdb2pov>=0.1.1"]

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/quiltwright"
Repository = "https://github.com/Flux-Frontiers/quiltwright"
Documentation = "https://flux-frontiers.github.io/quiltwright/"
Issues = "https://github.com/Flux-Frontiers/quiltwright/issues"

[project.scripts]
quiltwright = "quiltwright.cli.main:cli"

# ---------------------------------------------------------------------------
# Dependency groups (poetry)
# ---------------------------------------------------------------------------
# Groups mirror the PEP 621 extras above one-for-one, so `poetry install --with
# viz` and `pip install ".[viz]"` produce the same environment.  ffmpeg is
# deliberately its own group rather than part of viz: the binary imageio-ffmpeg
# bundles is a GPLv3 build (--enable-gpl --enable-version3), which a BSD-3
# project should hand people on request rather than by default.
[tool.poetry.group.viz]
optional = true

[tool.poetry.group.viz.dependencies]
pyvista = ">=0.44"

[tool.poetry.group.molecules]
optional = true

[tool.poetry.group.molecules.dependencies]
pypdb2pov = ">=0.1.1"

[tool.poetry.group.video]
optional = true

[tool.poetry.group.video.dependencies]
imageio-ffmpeg = ">=0.4"

# imageio-ffmpeg is a dev dependency as well as an extra: without it the video
# tests skip, and a skipped test reports success while asserting nothing.  It
# is the only skip condition pip alone can lift — the pyvista tests also need a
# system GL stack and an X server, which no dependency can supply.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=5.0"
ruff = ">=0.6"
imageio-ffmpeg = ">=0.4"
ty = ">=0.0.41"
pre-commit = ">=4.5.1"

# Maintainer tooling, not a dependency of this package.  Both CLIs index this
# repo for agents -- `pycodekg` the package source, `dockg` the prose -- and
# `.grok/config.toml` serves each as an MCP server.  Nothing under src/ imports
# either one.
#
# A Poetry group, not an extra: an extra is a feature of the package and lands
# in the published wheel metadata, which would hand every `pip install
# quiltwright` a torch and sentence-transformers install for tooling it will
# never run.  A group is locked and installable but stays out of that metadata.
#
#   poetry install --with kg      # pycodekg and dockg into .venv/bin
#   poetry install                # default -- the group is optional, skipped
#
# `kg` is the fleet-wide name for this group so there is one command to
# remember; contents are per-repo and cover only what this repo invokes.  Safe
# to lock despite quiltwright being layer 2 of the visualization stack: the
# only path back to this package is `kgmodule-utils[viz3d-qt]`, and pycode-kg
# asks for `kgmodule-utils[semantic,viz3d]`, which does not pull it in.  Should
# that change, `poetry lock` fails here rather than downstream.
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
pycode-kg = ">=0.24.1"
doc-kg = ">=0.22.0"

# The GitHub Pages site: mkdocs-material renders docs/*.md as-is, and
# mkdocstrings adds an API reference generated from the package's own
# docstrings so it can't drift from the code.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# Knowledge graphs.  Both tools also accept these as repeatable CLI flags
# (--include-dir / --exclude-dir); the values here are the defaults so a bare
# `pycodekg build` / `dockg build` indexes the same thing every time.

# The code graph is the package, not the harness around it.  tests/ and
# scripts/ are twice the size of src/ and would set the analysis grade:
# 162 test functions read as a "module to split", and undocumented test
# bodies drag docstring coverage from 94% to 55%.
[tool.pycodekg]
exclude = ["tests"]
include = ["src"]

# The doc graph is prose a reader would look for: docs/, the README, the
# changelog, the scene notes.  Render run-reports are generated per render
# and near-identical, so they crowd the graph and invent SIMILAR_TO edges.
[tool.dockg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests", "gallery", "molecules", "renders"
]

[tool.memorykg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests"
]
